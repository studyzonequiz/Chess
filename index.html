<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Troll Chess</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a24;
            color: #fff;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h2 { color: #f1c40f; margin-bottom: 5px; }
        .game-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 450px; }
        
        #secretPanel {
            background: #cd0000;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
            border: 2px solid #ff4747;
            width: 100%;
            box-sizing: border-box;
        }
        .toggle-btn { background-color: #e74c3c; margin: 5px; padding: 8px 12px; font-size: 13px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;}
        .toggle-btn.active { background-color: #2ecc71; box-shadow: 0 0 10px #2ecc71; }

        .status { margin: 5px 0 12px 0; font-size: 16px; color: #f39c12; font-weight: bold; }

        /* দাবা বোর্ড স্টাইল */
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 400px;
            height: 400px;
            border: 4px solid #3d2f1f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            cursor: pointer;
        }
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .selected { background-color: #7fffd4 !important; }

        /* ট্রোল ওভারলে */
        .troll-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9); display: flex; justify-content: center;
            align-items: center; z-index: 9999; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .troll-overlay.show { opacity: 1; pointer-events: auto; }
        .troll-box {
            background: #fff; padding: 35px; border-radius: 15px; text-align: center;
            max-width: 400px; width: 90%; color: #000;
        }
        .troll-headline { color: #e74c3c; font-size: 30px; font-weight: bold; margin-bottom: 15px; }
        .troll-message { font-size: 16px; margin-bottom: 25px; line-height: 1.5; }
        .troll-btn { background-color: #27ae60; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Ultimate Troll Chess ♟️</h2>
    
    <div class="game-container">
        <div id="secretPanel">
            <div style="font-weight: bold; margin-bottom: 5px; color: yellow;">👑 BOSS CONTROL PANEL 👑</div>
            <button class="toggle-btn" onclick="triggerInstantWin()">💥 Instant Win (Checkmate Soumyarup)</button>
            <button class="toggle-btn" id="shuffleToggle" onclick="toggleShuffleMode()">🔀 Soumyarup Piece Shuffle: OFF</button>
        </div>

        <div class="status" id="statusText">Loading Turn...</div>
        
        <div class="chess-board" id="board"></div>
    </div>

    <div class="troll-overlay" id="trollOverlay">
        <div class="troll-box">
            <div class="troll-headline">CHECKMATE! 💀</div>
            <div class="troll-message">CONGRATULATIONS 🎉 SOUMYARUP, JOY তোমাকে সফলতার সাথে প্রেগনেন্ট বানিয়েছে, এখন থেকে তুমি জয়ের বাচ্চার মা।</div>
            <button class="troll-btn" onclick="window.location.reload()">Reset Game</button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const statusText = document.getElementById('statusText');
        
        // দাবার ঘুটির ইউনিকোড ক্যারেক্টারসমূহ
        const pieces = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙',
            '': ''
        };

        // ইনিশিয়াল স্ট্যান্ডার্ড বোর্ড সেটআপ
        let boardState = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ];

        // 🎲 নিয়ম ১: প্রথম চাল কে পাবে সেটা ১০০% র্যান্ডমলি ঠিক হবে (W = জয়, B = সৌম্যরূপ)
        let currentTurn = Math.random() > 0.5 ? 'W' : 'B'; 
        let myColor = 'W'; // জয়ের কালার সবসময় হোয়াইট (নিচের দিক)
        let isShuffleModeActive = false;
        let selectedSquare = null;

        function toggleShuffleMode() {
            isShuffleModeActive = !isMagicShieldActive; // আগের ভেরিয়েবল রিসেট
            isShuffleModeActive = !isShuffleModeActive;
            const btn = document.getElementById('shuffleToggle');
            if (isShuffleModeActive) {
                btn.innerText = "🔀 Soumyarup Piece Shuffle: ON";
                btn.classList.add('active');
            } else {
                btn.innerText = "🔀 Soumyarup Piece Shuffle: OFF";
                btn.classList.remove('active');
            }
        }

        function triggerInstantWin() {
            document.getElementById('trollOverlay').classList.add('show');
        }

        // বোর্ড স্ক্রিনে রেন্ডার করার ফাংশন
        function createBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    square.classList.add((r + c) % 2 === 0 ? 'light' : 'dark');
                    square.dataset.row = r;
                    square.dataset.col = c;
                    
                    const piece = boardState[r][c];
                    square.innerText = pieces[piece] || '';
                    
                    // ঘুটির কালার অনুযায়ী টেক্সট কালার স্টাইল
                    if (piece === piece.toUpperCase() && piece !== '') {
                        square.style.color = '#fff'; // হোয়াইট পিস (জয়)
                    } else {
                        square.style.color = '#000'; // ব্ল্যাক পিস (সৌম্যরূপ)
                    }

                    square.addEventListener('click', onSquareClick);
                    boardElement.appendChild(square);
                }
            }
            updateStatusText();
        }

        function updateStatusText() {
            if (currentTurn === 'W') {
                statusText.innerText = "Joy's Turn (White) ⚪";
            } else {
                statusText.innerText = "Soumyarup's Turn (Black) ⚫";
                
                // 🤖 সৌম্যরূপের চাল আসার ১.৫ সেকেন্ড পর কম্পিউটার অটোমেটিক ওর একটা ঘুটিকে অদ্ভুত জায়গায় চালিয়ে দেবে!
                setTimeout(() => {
                    if (currentTurn === 'B') {
                        makeSoumyarupMove();
                    }
                }, 1500);
            }
        }

        // 🛑 সৌম্যরূপের চালের ট্রোল মেকানিজম (সাফেল বা ভুল চাল)
        function makeSoumyarupMove() {
            let blackPieces = [];
            // বোর্ডের সব কালো গুটি খুঁজে বের করা
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let p = boardState[r][c];
                    if (p !== '' && p === p.toLowerCase()) {
                        blackPieces.push({r, c, type: p});
                    }
                }
            }

            if (blackPieces.length > 0) {
                // র্যান্ডম একটা কালো গুটি সিলেক্ট করা
                let randomPiece = blackPieces[Math.floor(Math.random() * blackPieces.length)];
                
                // 🔀 যদি সাফেল মোড অন থাকে, তবে ওর গুটিটি বোর্ডের যেকোনো ফাঁকা জায়গায় গায়েব হয়ে বসে যাবে!
                if (isShuffleModeActive) {
                    let emptySquares = [];
                    for (let r = 2; r < 6; r++) {
                        for (let c = 0; c < 8; c++) {
                            if (boardState[r][c] === '') emptySquares.push({r, c});
                        }
                    }
                    if (emptySquares.length > 0) {
                        let target = emptySquares[Math.floor(Math.random() * emptySquares.length)];
                        boardState[randomPiece.r][randomPiece.c] = '';
                        boardState[target.r][target.g || target.c] = randomPiece.type; // সাইলেন্টলি প্লেস
                    }
                } else {
                    // নরমাল মোডেও কম্পিউটার জাস্ট ১ ঘর সামনে বা র্যান্ডম মুভ করবে (বোকা বানানোর জন্য)
                    let nextRow = Math.min(7, randomPiece.r + 1);
                    if (boardState[nextRow][randomPiece.c] === '') {
                        boardState[randomPiece.r][randomPiece.c] = '';
                        boardState[nextRow][randomPiece.c] = randomPiece.type;
                    }
                }
            }
            
            currentTurn = 'W'; // চাল শেষে জয়ের কাছে টার্ন ফেরত যাবে
            createBoard();
        }

        // জয়ের (আপনার) স্কয়ারে ক্লিক হ্যান্ডলার
        function onSquareClick(e) {
            if (currentTurn !== 'W') return; // সৌম্যরূপের টার্নে আপনি চাল দিতে পারবেন না

            const row = parseInt(e.currentTarget.dataset.row);
            const col = parseInt(e.currentTarget.dataset.col);
            const piece = boardState[row][col];

            if (selectedSquare) {
                // আগের সিলেক্ট করা গুটি নতুন ঘরে মুভ করা (সিম্পল মুভমেন্ট লজিক)
                const prevRow = selectedSquare.row;
                const prevCol = selectedSquare.col;
                
                boardState[row][col] = boardState[prevRow][prevCol];
                boardState[prevRow][prevCol] = '';
                
                selectedSquare = null;
                currentTurn = 'B'; // চাল শেষে সৌম্যরূপের টার্ন
                createBoard();
            } else {
                // শুধু নিজের (সাদা) গুটি সিলেক্ট করা যাবে
                if (piece !== '' && piece === piece.toUpperCase()) {
                    selectedSquare = {row, col};
                    e.currentTarget.classList.add('selected');
                }
            }
        }

        // গেম স্টার্ট
        createBoard();
    </script>
</body>
</html>
